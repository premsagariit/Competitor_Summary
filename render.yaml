services:
  - type: web
    name: competitor-analysis-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -e .
    startCommand: uvicorn competitor_analysis.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PARALLEL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Memory tuning for the free plan's 512MB cap: Phase 2 parses all 7
      # insurer PDFs concurrently (pdfplumber's object graph is heavy per
      # document) and issues Gemini calls concurrently on top of that -
      # both default higher (3 / 8) for a dev machine with real headroom.
      - key: PDF_PARSE_MAX_WORKERS
        value: "2"
      - key: GEMINI_MAX_CONCURRENCY
        value: "3"
