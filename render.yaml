services:
  - type: web
    name: competitor-analysis-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -e .
    startCommand: uvicorn competitor_analysis.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PARALLEL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Memory tuning for the free plan's 512MB cap. Phase 2 parses the
      # insurer PDFs concurrently and issues Gemini calls concurrently on
      # top of that; both default higher (3 / 8) for a dev machine with
      # real headroom. Measured end to end at these values, cold caches:
      # 317MB peak for Phase 2 + Phase 3. Raise them only against a fresh
      # measurement - before pdf_cache released per-page caches, a single
      # 51-page filing peaked at 822MB and OOM-killed the instance.
      - key: PDF_PARSE_MAX_WORKERS
        value: "2"
      - key: GEMINI_MAX_CONCURRENCY
        value: "3"
      # Soft ceiling. A filing heavy enough to approach the 512MB hard cap
      # is abandoned with a warning and the run continues without it,
      # instead of the kernel SIGKILLing the container mid-run. Deliberately
      # ~110MB under the cap: the check fires between pages, so RSS
      # overshoots the budget before the document is released (measured at
      # ~50MB). A normal run peaks at 317MB, so this should never fire.
      - key: MEMORY_BUDGET_MB
        value: "400"
