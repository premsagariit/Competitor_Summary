[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-analysis"
version = "0.1.0"
description = "Competitor analysis and report generation for Indian health insurers (SAHI and industry-wide GIC statistics)"
requires-python = ">=3.11"
dependencies = [
    # Phase 1 - retrieval
    "parallel-web",
    "httpx",
    "aiofiles",
    "python-dotenv",
    # Phase 2 - extraction
    "pdfplumber",
    "pypdf",
    "openpyxl",
    "google-genai",
    # Phase 3 - reporting
    "matplotlib",
    # Phase 4 - dashboard
    "streamlit",
    # HTTP API consumed by the React dashboard
    "fastapi",
    "uvicorn[standard]",
    # Durable document storage (Cloudflare R2, S3-compatible)
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# Single entrypoint for the whole pipeline: `competitor-analysis --help`
competitor-analysis = "competitor_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
